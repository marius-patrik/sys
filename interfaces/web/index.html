<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Intelligence</title>
<style>
:root{font:15px system-ui,sans-serif;color-scheme:dark;background:#101114;color:#f0f1f5}
body{margin:auto;max-width:1150px;padding:20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
section{min-width:0;border:1px solid #3a3d49;border-radius:12px;padding:14px;background:#181b20}
button,textarea{color:inherit;background:#252a34;border:1px solid #475061;border-radius:7px;padding:9px;font:inherit}
button{cursor:pointer}button:hover{border-color:#a4afe7}textarea{width:100%;box-sizing:border-box;min-height:70px}
.actions{display:flex;flex-wrap:wrap;gap:8px}.rows{overflow:auto}table{border-collapse:collapse;width:100%}
td,th{text-align:left;border-bottom:1px solid #343942;padding:6px;max-width:180px;word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word}small{color:#a5a9b6}
</style></head><body>
<header><h1>Living Intelligence</h1><p><small>Rendered from the database-owned Control interface</small></p>
<form id="input"><textarea id="text" placeholder="Ask, remember, recall or request a graph…" required></textarea>
<button>Submit</button></form><p id="status" role="status">Connecting…</p></header>
<main id="workspace"></main><section><h2>Selected output</h2><pre id="output">No event selected</pre></section>
<script>
"use strict";
const byId=id=>document.getElementById(id);
const node=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);return n};
async function api(url,init){const r=await fetch(url,init);if(!r.ok)throw Error(await r.text());return r.json()}
async function invoke(path,text){
 const request={method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":crypto.randomUUID()},body:JSON.stringify({text})};
 const answer=await api(path,request);byId("status").textContent="Accepted event "+answer.event_id;await follow(answer.event_id)
}
async function follow(id){
 for(let i=0;i<45;i++){
 const event=await api("/v1/events/"+id);byId("output").textContent=JSON.stringify(event,null,2);
 if((event.activations||[]).length&&event.activations.every(a=>a.state==="completed"||a.state==="failed"))break;
 await new Promise(resolve=>setTimeout(resolve,500))
 }
}
function component(def,catalog){
 const type=def?.type;
 if(type==="container"){
   const frag=document.createDocumentFragment();
   for(const child of def.children||[])frag.append(component(child,catalog));
   return frag
 }
 const section=node("section");section.append(node("h2",def?.title||type||"View"));
 if(type==="action-list"){
   const list=node("div");list.className="actions";
   for(const action of catalog.actions||[]){
     const b=node("button",action.title);
     b.title=action.id;b.onclick=()=>invoke(action.invoke,byId("text").value).catch(error=>byId("status").textContent=error.message);
     list.append(b)
   }
   section.append(list)
 }else if(type==="activity-list"){
   const target=node("div");section.append(target);
   api("/v1/control/activity").then(data=>{
     for(const a of data.activations||[]){
       const b=node("button",a.graph_revision+" · "+a.state);
       b.onclick=()=>api("/v1/control/handles/"+a.id).then(x=>byId("output").textContent=JSON.stringify(x,null,2));
       target.append(b)
     }
   }).catch(error=>target.textContent=error.message)
 }else if(type==="table" && typeof def.source==="string"){
   const target=node("div");target.className="rows";section.append(target);
   api("/v1/control/data/"+encodeURIComponent(def.source)).then(data=>{
      const t=node("table"),head=node("tr");
      for(const name of data.columns||[])head.append(node("th",name));
      head.append(node("th","Actions"));t.append(head);
      for(const record of data.rows||[]){
        const tr=node("tr");
        for(const col of data.columns||[])tr.append(node("td",record[col]));
        const actions=node("td");
        for(const action of data.rowActions||[]){
          const b=node("button",action.label);
          b.onclick=()=>invoke("/v1/control/actions/"+encodeURIComponent(action.actionId),String(record[action.inputField])).catch(error=>byId("status").textContent=error.message);
          actions.append(b)
        }
        tr.append(actions);t.append(tr)
      }
      target.append(t)
   }).catch(error=>target.textContent=error.message)
 }else{
   section.append(node("pre",JSON.stringify(def,null,2)))
 }
 return section
}
async function render(){
 try{
   const [catalog,view]=await Promise.all([api("/v1/control/catalog"),api("/v1/control/views/interface.root")]);
   const root=byId("workspace");root.replaceChildren(component(view.definition,catalog));
   byId("status").textContent="Connected · "+catalog.actions.length+" actions"
 }catch(error){byId("status").textContent=error.message}
}
byId("input").onsubmit=e=>{e.preventDefault();invoke("/v1/inputs",byId("text").value).then(render).catch(error=>byId("status").textContent=error.message)}
render();setInterval(render,5000);
</script></body></html>
