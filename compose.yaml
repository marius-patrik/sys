name: living-dev
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: living-core:dev
    environment:
      LIVING_DATABASE_URL_FILE: /run/secrets/living_database_url
      LIVING_SEAL_KEY_FILE: /run/secrets/living_seal_key
      LIVING_BOOTSTRAP_TOKEN_FILE: /run/secrets/living_control_token
      LIVING_LISTEN: 0.0.0.0:8080
      LIVING_DEV_MODE: "1"
      LIVING_MIGRATE_ON_BOOT: "1"
    secrets: [living_database_url, living_seal_key, living_control_token]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    ports:
      - "127.0.0.1:${LIVING_PORT:-8080}:8080"
    restart: unless-stopped
secrets:
  living_database_url:
    file: ./.private/living_database_url
  living_seal_key:
    file: ./.private/living_seal_key
  living_control_token:
    file: ./.private/living_control_token
