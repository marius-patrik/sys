name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-postgres:
    name: Pure contracts and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: living
          POSTGRES_USER: living
          POSTGRES_PASSWORD: living_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U living -d living"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      LIVING_TEST_DATABASE_URL: postgresql://living:living_test_password@127.0.0.1:5432/living
      LIVING_BOOTSTRAP_TOKEN: test-control-token-0123456789-abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Syntax and pure contracts
        run: |
          python -m compileall -q core tests contracts interfaces scripts
          python -m unittest discover -s tests -p 'test_engine_*.py' -v
          python contracts/test_contracts.py
      - name: PostgreSQL-backed tests (mandatory)
        run: |
          python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
          python -m unittest discover -s tests -p 'test_full_system.py' -v
          python -m unittest discover -s tests -p 'test_model_gateway.py' -v
          python -m unittest discover -s tests -p 'test_reliability.py' -v
      - name: Live HTTP smoke test against PostgreSQL
        run: |
          export LIVING_DATABASE_URL="$LIVING_TEST_DATABASE_URL"
          export LIVING_DEV_MODE=1 LIVING_MIGRATE_ON_BOOT=1
          PYTHONPATH=core/livingd python -m livingd serve --listen 127.0.0.1:8080 > /tmp/livingd.log 2>&1 &
          CORE_PID=$!
          trap 'kill "$CORE_PID" 2>/dev/null || true; cat /tmp/livingd.log' EXIT
          python scripts/smoke.py
      - name: DSH bundle syntax
        run: node --check plugins/dsh/living/index.js
      - name: DSH node bridge contract
        run: node --test tests/test_dsh_bridge.mjs
      - name: Dynamic web renderer JavaScript syntax
        run: |
          python -c "from pathlib import Path; html=Path('interfaces/web/index.html').read_text(); Path('/tmp/living-view.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/living-view.js
  oci:
    name: Physical OCI sandbox smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned Python worker runtime
        run: docker pull python:3.12-alpine
      - name: Exercise read-only, no-network sandbox
        env:
          LIVING_TEST_OCI: "1"
        run: python3 -m unittest discover -s tests -p 'test_oci_worker.py' -v

  nix:
    name: Nix package build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Evaluate and build livingd
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake lock
          nix --extra-experimental-features 'nix-command flakes' build --no-link .#livingd
          nix --extra-experimental-features 'nix-command flakes' build --no-link .#coreImage
      - name: Load and boot the packaged OCI entrypoint
        run: |
          IMAGE_TAR="$(nix --extra-experimental-features 'nix-command flakes' build --print-out-paths --no-link .#coreImage)"
          docker load -i "$IMAGE_TAR"
          docker run --rm living-core:v0.28-dev --help
      - name: Commit pinned flake lock on the import branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/living-vertical-slice'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: pin Nix dependency versions"
            git push origin HEAD:feat/living-vertical-slice
          fi
